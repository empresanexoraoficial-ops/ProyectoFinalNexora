<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="pag.gastos">StockFlow — Gastos</title>
  <script src="../js/tema.js"></script>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="header-izquierda">
      <button class="btn-hamburguesa" id="btn-hamburguesa" aria-label="Abrir menú" data-i18n-aria="comun.abrir_menu"><span></span><span></span><span></span></button>
      <a href="inicio.html" class="header-titulo-link">StockFlow</a>
    </div>
    <div class="header-derecha">
      <button class="usuario-btn" id="usuario-btn" aria-label="Detalles de cuenta" data-i18n-aria="comun.detalles_cuenta"></button>
      <div class="usuario-dropdown" id="usuario-dropdown"></div>
    </div>
  </header>
  <div class="app-cuerpo">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <nav class="sidebar" id="sidebar">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Contraer o expandir menú" type="button" data-i18n-aria="comun.contraer_menu"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <ul class="nav-lista" id="nav-lista"></ul>
    </nav>
    <main class="app-contenido">
      <p class="breadcrumb"><span data-i18n="menu.inicio">Inicio</span> / <strong data-i18n="menu.gastos">Gastos</strong></p>
      <h1 class="pagina-titulo" data-i18n="gastos.titulo">Gastos Operativos</h1>
      <div class="card">
        <p class="card-titulo" data-i18n="gastos.cargar">Cargar gasto</p>
        <div class="form-grid">
          <div class="campo"><label data-i18n="comun.categoria_req">Categoría *</label><input type="text" id="gasto-cat" placeholder="Logística, publicidad..." data-i18n-placeholder="gastos.ph_categoria" /><span class="error-msg" id="err-gasto-cat"></span></div>
          <div class="campo"><label data-i18n="comun.monto_req">Monto *</label><input type="number" step="0.01" id="gasto-monto" /><span class="error-msg" id="err-gasto-monto"></span></div>
          <div class="campo"><label data-i18n="ventas.ticket_fecha">Fecha</label><input type="date" id="gasto-fecha" /></div>
          <div class="campo campo-completo"><label data-i18n="comun.descripcion">Descripción</label><input type="text" id="gasto-desc" /></div>
        </div>
        <button class="btn-primary" style="margin-top:var(--espacio-md)" onclick="registrarGasto()" data-i18n="gastos.registrar">Registrar gasto</button>
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <div style="padding:var(--espacio-lg) var(--espacio-lg) 0;display:flex;justify-content:space-between;align-items:center">
          <p class="card-titulo" style="border:none;margin:0;padding:0" data-i18n="gastos.historial">Historial</p>
          <span style="font-weight:700;color:var(--color-primario)" id="gastos-total">$0.00</span>
        </div>
        <div class="tabla-contenedor">
          <table><thead><tr><th data-i18n="ventas.ticket_fecha">Fecha</th><th data-i18n="rep.categoria">Categoría</th><th data-i18n="comun.descripcion">Descripción</th><th data-i18n="gastos.registrado_por">Registrado por</th><th data-i18n="rep.monto">Monto</th></tr></thead>
          <tbody id="tbody-gastos"></tbody></table>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="../js/store.js"></script>
<script>protegerPaginaAsync('gastos');</script>
<script src="../js/English.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/gastos.js"></script>
</body>
</html>
