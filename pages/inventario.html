<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockFlow — Inventario</title>
  <script src="../js/tema.js"></script>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="header-izquierda">
      <button class="btn-hamburguesa" id="btn-hamburguesa" aria-label="Abrir menú"><span></span><span></span><span></span></button>
      <a href="inicio.html" class="header-titulo-link">StockFlow</a>
    </div>
    <div class="header-derecha">
      <button class="usuario-btn" id="usuario-btn" aria-label="Detalles de cuenta"></button>
      <div class="usuario-dropdown" id="usuario-dropdown"></div>
    </div>
  </header>
  <div class="app-cuerpo">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <nav class="sidebar" id="sidebar" aria-label="Navegación principal">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Contraer o expandir menú" type="button"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <ul class="nav-lista" id="nav-lista"></ul>
    </nav>
    <main class="app-contenido">
      <p class="breadcrumb">Inicio / <strong>Inventario</strong></p>
      <h1 class="pagina-titulo">Inventario</h1>

      <div class="tabla-acciones">
        <input class="tabla-buscar" id="buscar-producto" type="text" placeholder="Buscar por nombre, marca o tipo..." />
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn-primary" id="btn-nuevo-producto" onclick="abrirModalProducto()" style="display:none">+ Nuevo producto</button>
        </div>
      </div>

      <div class="card" style="padding:0;overflow:hidden">
        <div class="tabla-contenedor">
          <table>
            <thead>
              <tr>
                <th>Nombre</th><th>Tipo</th><th>Marca</th>
                <th>Precio venta</th><th>Stock total</th><th>Variantes</th><th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tbody-inventario"></tbody>
          </table>
        </div>
      </div>

      <!-- Modal: nuevo producto (SOLO Administrador) -->
      <div class="modal-overlay" id="modal-producto">
        <div class="modal">
          <div class="modal-header">
            <span class="modal-titulo">Nuevo producto</span>
            <button class="modal-cerrar" onclick="cerrarModalProducto()">✕</button>
          </div>
          <div class="modal-body">
            <div class="form-grid">
              <div class="campo campo-completo">
                <label>Nombre *</label>
                <input type="text" id="prod-nombre" placeholder="Nombre del producto" />
                <span class="error-msg" id="err-prod-nombre"></span>
              </div>
              <div class="campo">
                <label>Tipo *</label>
                <select id="prod-tipo" onchange="alCambiarTipo()">
                  <option value="">Elegir tipo...</option>
                </select>
                <span class="error-msg" id="err-prod-tipo"></span>
              </div>
              <div class="campo">
                <label>Categoría</label>
                <input type="text" id="prod-categoria" placeholder="Ej: Ropa de verano" />
              </div>
              <div class="campo">
                <label>Precio costo ($)</label>
                <input type="number" step="0.01" min="0" id="prod-precio-costo" placeholder="0.00" />
              </div>
              <div class="campo">
                <label>Precio venta ($)</label>
                <input type="number" step="0.01" min="0" id="prod-precio-venta" placeholder="0.00" />
                <span class="error-msg" id="err-prod-precio"></span>
              </div>
              <div class="campo campo-completo">
                <label>Descripción</label>
                <input type="text" id="prod-descripcion" placeholder="Opcional" />
              </div>
              <!-- Acá se arman dinámicamente los campos de atributos FIJOS del
                   tipo elegido (ej: Marca) — ver alCambiarTipo() en inventario.js -->
              <div class="campo campo-completo" id="prod-atributos-fijos" style="display:flex;flex-direction:column;gap:12px"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn-secundario" onclick="cerrarModalProducto()">Cancelar</button>
            <button class="btn-primary" onclick="guardarProducto()">Crear producto</button>
          </div>
        </div>
      </div>

      <!-- Modal: agregar variante a un producto existente (Admin o Repositor) -->
      <div class="modal-overlay" id="modal-variante">
        <div class="modal">
          <div class="modal-header">
            <span class="modal-titulo">Agregar variante — <span id="variante-producto-nombre"></span></span>
            <button class="modal-cerrar" onclick="cerrarModalVariante()">✕</button>
          </div>
          <div class="modal-body">
            <p style="font-size:var(--texto-sm);color:var(--texto-secundario);margin-bottom:var(--espacio-md)">
              El stock inicial se carga desde <strong>Ingresos</strong>, no acá — esta variante arranca en 0.
            </p>
            <div class="form-grid">
              <div class="campo">
                <label>SKU (opcional)</label>
                <input type="text" id="var-sku" placeholder="Ej: REM-AZ-M" />
              </div>
              <div class="campo">
                <label>Stock mínimo</label>
                <input type="number" min="0" id="var-stock-min" value="0" />
              </div>
              <div class="campo campo-completo" id="var-vencimiento-cont" style="display:none">
                <label>Fecha de vencimiento</label>
                <input type="date" id="var-vencimiento" />
              </div>
              <!-- Campos dinámicos de atributos QUE SÍ generan variante (ej: Talle, Color) -->
              <div class="campo campo-completo" id="var-atributos" style="display:flex;flex-direction:column;gap:12px"></div>
              <span class="error-msg" id="err-variante"></span>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn-secundario" onclick="cerrarModalVariante()">Cancelar</button>
            <button class="btn-primary" onclick="guardarVariante()">Agregar variante</button>
          </div>
        </div>
      </div>

      <!-- Modal: ver variantes de un producto -->
      <div class="modal-overlay" id="modal-ver-variantes">
        <div class="modal">
          <div class="modal-header">
            <span class="modal-titulo">Variantes — <span id="ver-variantes-nombre"></span></span>
            <button class="modal-cerrar" onclick="document.getElementById('modal-ver-variantes').classList.remove('visible')">✕</button>
          </div>
          <div class="modal-body">
            <div class="tabla-contenedor">
              <table>
                <thead><tr><th>SKU</th><th>Atributos</th><th>Stock</th><th>Mínimo</th><th>Vence</th></tr></thead>
                <tbody id="tbody-variantes"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="../js/store.js"></script>
<script>protegerPaginaAsync('inventario');</script>
<script src="../js/nav.js"></script>
<script src="../js/inventario.js"></script>
</body>
</html>
