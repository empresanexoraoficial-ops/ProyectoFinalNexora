<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockFlow — Configuración</title>
  <script src="../js/tema.js"></script>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="header-izquierda">
      <button class="btn-hamburguesa" id="btn-hamburguesa" aria-label="Abrir menú"><span></span><span></span><span></span></button>
      <a href="inicio.html" class="header-titulo-link">StockFlow</a>
    </div>
    <div class="header-derecha">
      <button class="usuario-btn" id="usuario-btn" aria-label="Detalles de cuenta"></button>
      <div class="usuario-dropdown" id="usuario-dropdown"></div>
    </div>
  </header>
  <div class="app-cuerpo">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <nav class="sidebar" id="sidebar">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Contraer o expandir menú" type="button"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <ul class="nav-lista" id="nav-lista"></ul>
    </nav>
    <main class="app-contenido">
      <p class="breadcrumb">Inicio / <strong>Configuración</strong></p>
      <h1 class="pagina-titulo">Configuración</h1>
      <p style="color:var(--texto-secundario);font-size:var(--texto-sm);margin-bottom:var(--espacio-lg)">
        Preferencias personales. Se guardan en este navegador y se aplican en todas las pantallas.
      </p>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--espacio-lg)">
        <div class="card">
          <p class="card-titulo">Idioma</p>
          <div class="campo">
            <label for="pref-idioma">Idioma de la interfaz</label>
            <select id="pref-idioma">
              <option value="es">Español</option>
              <option value="en">English</option>
            </select>
          </div>
        </div>

        <div class="card">
          <p class="card-titulo">Apariencia</p>
          <div class="campo">
            <label for="pref-tema">Tema</label>
            <select id="pref-tema">
              <option value="claro">Claro</option>
              <option value="oscuro">Oscuro</option>
            </select>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="../js/store.js"></script>
<script>protegerPaginaAsync('configuracion');</script>
<script src="../js/nav.js"></script>
<script src="../js/configuracion.js"></script>
</body>
</html>
