      <a href="inicio.html" class="header-titulo-link">StockFlow</a>
    </div>
    <div class="header-derecha">
      <button class="usuario-btn" id="usuario-btn" aria-label="Detalles de cuenta"></button>
      <div class="usuario-dropdown" id="usuario-dropdown"></div>
    </div>
  </header>
  <div class="app-cuerpo">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <nav class="sidebar" id="sidebar">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Contraer o expandir menú" type="button"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <ul class="nav-lista">
        <li class="nav-item"><a href="inicio.html"><span class="nav-icono"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></span><span class="nav-texto">Inicio</span></a></li>
        <li class="nav-item"><a href="dashboard.html"><span class="nav-icono"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.3"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.3"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.3"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.3"/></svg></span><span class="nav-texto">Dashboard</span></a></li>
        <li class="nav-item"><a href="ingresos.html"><span class="nav-icono"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 17v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg></span><span class="nav-texto">Ingresos</span></a></li>
        <li class="nav-item"><a href="inventario.html"><span class="nav-icono"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5L12 3l9 4.5-9 4.5-9-4.5z"/><path d="M3 7.5v9L12 21l9-4.5v-9"/><path d="M12 12v9"/></svg></span><span class="nav-texto">Inventario</span></a></li>
        <li class="nav-item"><a href="ventas.html"><span class="nav-icono"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11.2a1.4 1.4 0 001.4 1.1h8.4a1.4 1.4 0 001.4-1.1L20.5 8.5H6"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg></span><span class="nav-texto">Nueva Venta</span></a></li>
        <li class="nav-item"><a href="gastos.html"><span class="nav-icono"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8 12h8"/></svg></span><span class="nav-texto">Gastos</span></a></li>
        <li class="nav-item"><a href="reportes.html"><span class="nav-icono"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11"/><path d="M11 20V6"/><path d="M18 20v-7"/></svg></span><span class="nav-texto">Reportes</span></a></li>
        <li class="nav-item"><a href="personal.html"><span class="nav-icono"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c0-4 3.5-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/></svg></span><span class="nav-texto">Personal</span></a></li>
        <li class="nav-item"><a href="configuracion.html"><span class="nav-icono"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09a1.7 1.7 0 001.55-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z"/></svg></span><span class="nav-texto">Configuración</span></a></li>
        <li class="nav-separador"></li>
      </ul>
    </nav>
    <main class="app-contenido">
      <p class="breadcrumb">Inicio / <strong>Personal</strong></p>
      <h1 class="pagina-titulo">Gestión de Personal</h1>
      <div class="tabla-acciones">
        <input class="tabla-buscar" id="buscar-usuario" type="text" placeholder="Buscar..." />
        <button class="btn-primary" onclick="abrirModalUsuario()">+ Nuevo usuario</button>
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <div class="tabla-contenedor">
          <table><thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead>
          <tbody id="tbody-personal"></tbody></table>
        </div>
      </div>
      <div class="modal-overlay" id="modal-usuario">
        <div class="modal">
          <div class="modal-header">
            <span class="modal-titulo" id="modal-usuario-titulo">Nuevo usuario</span>
            <button class="modal-cerrar" onclick="cerrarModalUsuario()">✕</button>
          </div>
          <div class="modal-body">
            <div class="form-grid">
              <div class="campo campo-completo"><label>Nombre *</label><input type="text" id="usr-nombre" /><span class="error-msg" id="err-usr-nombre"></span></div>
              <div class="campo"><label>Email *</label><input type="email" id="usr-email" /><span class="error-msg" id="err-usr-email"></span></div>
              <div class="campo"><label>Rol *</label>
                <select id="usr-rol">
                  <option value="">Seleccioná</option>
                  <option value="administrador">Administrador</option>
                  <option value="vendedor">Vendedor</option>
                  <option value="repositor">Repositor</option>
                </select>
                <span class="error-msg" id="err-usr-rol"></span>
              </div>
              <div class="campo"><label id="lbl-password">Contraseña *</label><input type="password" id="usr-password" /><span class="error-msg" id="err-usr-password"></span></div>
              <div class="campo"><label>Estado</label>
                <select id="usr-activo"><option value="true">Activo</option><option value="false">Inactivo</option></select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn-secundario" onclick="cerrarModalUsuario()">Cancelar</button>
            <button class="btn-primary" onclick="guardarUsuario()">Guardar</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="../js/store.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/personal.js"></script>
</body>
</html>
