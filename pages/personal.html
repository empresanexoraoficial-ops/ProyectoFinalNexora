<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="pag.personal">StockFlow — Personal</title>
  <script src="../js/tema.js"></script>
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="header-izquierda">
      <button class="btn-hamburguesa" id="btn-hamburguesa" aria-label="Abrir menú" data-i18n-aria="comun.abrir_menu"><span></span><span></span><span></span></button>
      <a href="inicio.html" class="header-titulo-link">StockFlow</a>
    </div>
    <div class="header-derecha">
      <button class="usuario-btn" id="usuario-btn" aria-label="Detalles de cuenta" data-i18n-aria="comun.detalles_cuenta"></button>
      <div class="usuario-dropdown" id="usuario-dropdown"></div>
    </div>
  </header>
  <div class="app-cuerpo">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <nav class="sidebar" id="sidebar">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Contraer o expandir menú" type="button" data-i18n-aria="comun.contraer_menu"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <ul class="nav-lista" id="nav-lista"></ul>
    </nav>
    <main class="app-contenido">
      <p class="breadcrumb"><span data-i18n="menu.inicio">Inicio</span> / <strong data-i18n="menu.personal">Personal</strong></p>
      <h1 class="pagina-titulo" data-i18n="personal.titulo">Gestión de Personal</h1>
      <div class="tabla-acciones">
        <input class="tabla-buscar" id="buscar-usuario" type="text" placeholder="Buscar..." data-i18n-placeholder="comun.buscar_puntos" />
        <button class="btn-primary" onclick="abrirModalUsuario()" data-i18n="personal.btn_nuevo">+ Nuevo usuario</button>
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <div class="tabla-contenedor">
          <table><thead><tr><th data-i18n="comun.nombre">Nombre</th><th data-i18n="nav.email">Email</th><th data-i18n="nav.rol">Rol</th><th data-i18n="rep.estado">Estado</th><th data-i18n="comun.acciones">Acciones</th></tr></thead>
          <tbody id="tbody-personal"></tbody></table>
        </div>
      </div>
      <div class="modal-overlay" id="modal-usuario">
        <div class="modal">
          <div class="modal-header">
            <span class="modal-titulo" id="modal-usuario-titulo">Nuevo usuario</span>
            <button class="modal-cerrar" onclick="cerrarModalUsuario()">✕</button>
          </div>
          <div class="modal-body">
            <div class="form-grid">
              <div class="campo campo-completo"><label data-i18n="comun.nombre_req">Nombre *</label><input type="text" id="usr-nombre" /><span class="error-msg" id="err-usr-nombre"></span></div>
              <div class="campo"><label data-i18n="comun.email_req">Email *</label><input type="email" id="usr-email" /><span class="error-msg" id="err-usr-email"></span></div>
              <div class="campo"><label data-i18n="comun.rol_req">Rol *</label>
                <select id="usr-rol">
                  <option value="" data-i18n="personal.seleccionar">Seleccioná</option>
                  <option value="administrador" data-i18n="rol.administrador">Administrador</option>
                  <option value="vendedor" data-i18n="ventas.ticket_vendedor">Vendedor</option>
                  <option value="repositor" data-i18n="rol.repositor">Repositor</option>
                </select>
                <span class="error-msg" id="err-usr-rol"></span>
              </div>
              <div class="campo"><label id="lbl-password">Contraseña *</label><input type="password" id="usr-password" /><span class="error-msg" id="err-usr-password"></span></div>
              <div class="campo"><label data-i18n="rep.estado">Estado</label>
                <select id="usr-activo"><option value="true" data-i18n="personal.activo">Activo</option><option value="false" data-i18n="personal.inactivo">Inactivo</option></select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn-secundario" onclick="cerrarModalUsuario()" data-i18n="comun.cancelar">Cancelar</button>
            <button class="btn-primary" onclick="guardarUsuario()" data-i18n="comun.guardar">Guardar</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="../js/store.js"></script>
<script src="../js/English.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/personal.js"></script>
</body>
</html>
